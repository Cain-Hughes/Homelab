# Secondary monitoring instance on the Docker host.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    container_name: uptime-kuma-secondary
    restart: unless-stopped
    ports:
      - "10.10.20.5:3001:3001"
    volumes:
      - ./data:/app/data
    environment:
      TZ: America/New_York
    dns:
      - 10.10.20.6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
